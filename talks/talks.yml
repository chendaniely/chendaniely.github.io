# talks.yml — single source of truth for every talk.
# Consumed by: talks page listing (talks.ejs), academic CV (later),
# video/transcript pipeline (later — `id` is the join key).
#
# TEMPLATE — copy this block for a new talk, delete every line that
# doesn't apply (omit unused fields entirely; no empty strings):
#
# - id: YYYY-MM-DD-event-slug        # stable slug — never change once set
#   title: "Talk title"              # omit until known; page falls back to event
#   date: YYYY-MM-DD                 # your talk's day; for multi-day events use
#                                    # the start date until your slot is announced
#   type: talk                       # talk | invited | keynote | workshop |
#                                    # tutorial | guest-lecture | panel
#   event: Conference or Meetup Name
#   event-url: https://...           # event / schedule page
#   location: City, Region, Country  # or: virtual
#   categories: [python, teaching]   # theme tags (not locations)
#   description: >
#     One or two sentences — feeds the page snippet and the CV line.
#   repo: https://github.com/...     # code / materials
#   slides: https://...
#   video: https://...
#   with: [Co Presenter]             # omit when solo

