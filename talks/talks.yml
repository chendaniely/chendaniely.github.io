# talks.yml — single source of truth for every talk.
# Consumed by: talks page listing (talks.ejs), academic CV (later),
# video/transcript pipeline (later — `id` is the join key).
#
# TEMPLATE — copy this block for a new talk, delete every line that
# doesn't apply (omit unused fields entirely; no empty strings):
#
# - id: YYYY-MM-DD-event-slug        # stable slug — never change once set
#   title: "Talk title"              # omit until known; page falls back to event
#   date: YYYY-MM-DD                 # your talk's day; for multi-day events use
#                                    # the start date until your slot is announced.
#                                    # Add a `# * approximate` comment when the
#                                    # exact day isn't known
#   type: talk                       # talk | invited | keynote | lightning-talk |
#                                    # panel | poster | guest-lecture |
#                                    # workshop | tutorial
#                                    # (the page lists workshop + tutorial under
#                                    # "Workshops", everything else under "Talks")
#   event: Conference or Meetup Name
#   event-url: https://...           # event / schedule page
#   location: City, Region, Country  # or: virtual
#   categories: [python, teaching]   # theme tags (not locations)
#   languages: [r, python]           # programming languages the talk covers
#   packages: [ellmer, chatlas]      # packages/libraries featured, any language
#   description: >
#     One or two sentences in your own voice —
#     feeds the page snippet and the CV line.
#   abstract: |
#     The OFFICIAL submitted abstract, verbatim — never edited after the
#     fact. Not shown on the listing page; archived here (conference sites
#     rot) and shown on future per-talk pages. Multi-paragraph is fine.
#   venue-type: practitioner         # CV only, not shown on the page:
#                                    # academic | practitioner | community |
#                                    # institutional
#   scope: National                  # CV only: Local | National | International
#   ubc-section: 10b                 # CV only, and only to override the default
#                                    # UBC CV section: 10b | 10c | 10e
#   repo: https://github.com/...     # code / materials
#   slides: https://...
#   video: https://...
#   with: [Co Presenter]             # omit when solo

