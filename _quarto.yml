project:
  type: website
  render:
    # 🤖 render everything except docs/ — it holds local planning files
    # (gitignored) whose markdown contains Quarto shortcodes in code samples
    # that break the build if rendered as site content
    - "*"
    - "!docs/**"
  # 🤖 pull GitHub repos tagged `vibe-coded` into projects/vibe-coded.yml
  # before every render (feeds the vibe-coded list on projects/index.qmd)
  pre-render: _scripts/fetch-vibe-coded.py

website:
  title: "Daniel Chen"
  site-url: https://chendaniely.github.io  # 🤖 required for RSS feed generation
  google-analytics: "G-H85THYPX4L"
  announcement:
    icon: info-circle
    # 🤖 Quarto hides a dismissed banner forever; scroll-reveal.html makes
    # it come back on each new visit instead
    dismissable: true
    content: "**Learn Anything with AI** - I'm co-teaching a one-week retreat on how to [learn anything with AI](https://learn-anything.nonlinearlabs.ai/) with [Eric Ma](https://ericmjl.github.io/), February 2027"
    type: primary
    position: below-navbar
  navbar:
    left:
      - href: blog.qmd
        text: Blog
      - href: talks/index.qmd
        text: Talks
      - href: teaching/index.qmd
        text: Teaching
      - href: projects/index.qmd
        text: Projects
    # 🤖 About, then a GitHub icon for the site's source repo, top right beside
    # the light/dark toggle; aria-label gives the icon-only link a screen-reader name
    right:
      - href: about.qmd
        text: About
      - icon: github
        href: https://github.com/chendaniely/chendaniely.github.io
        aria-label: GitHub repository for this site
  page-footer:
    left: "© Daniel Chen · [RSS](/blog.xml) · [Source](https://github.com/chendaniely/chendaniely.github.io)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      # 🤖 dark listed first = dark is the default appearance;
      # the navbar toggle still switches to light
      dark: [cosmo, brand, theme.scss, theme-dark.scss]
      light: [cosmo, brand, theme.scss]
    toc: true
    include-after-body: scroll-reveal.html
