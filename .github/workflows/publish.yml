on:
  push:
    branches: [main]
  workflow_dispatch:

name: Publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # 🤖 Don't init submodules here — we cache them separately below
        # to avoid re-downloading submodule data on every run.

      # 🤖 Submodule caching: the parent repo pins each submodule to a specific
      # commit. We hash those pinned SHAs to build a cache key that only busts
      # when a submodule is actually updated, not on every push.
      - name: Get submodule cache key
        id: submodule-hashes
        run: |
          echo "hash=$(git submodule status | awk '{print $1}' | sort | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            submodules/
            .git/modules/
          key: submodules-${{ steps.submodule-hashes.outputs.hash }}

      - name: Initialize submodules
        # Only runs on cache miss; skipped when cached data is still valid
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # 🤖 pinned: the R-package cache key embeds the R version, so an
          # unpinned (latest) R silently busts the cache on every R release.
          # Bumping R is now a deliberate edit here and in preview.yml.
          r-version: "4.6.1"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          cache-version: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
