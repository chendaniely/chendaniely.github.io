<script>
// The site's ONLY custom JavaScript.
// 1) Elements with class .reveal fade up when scrolled into view.
// 2) Cards/polaroids get a random resting tilt each page load.
// 3) A thin orange reading-progress bar tracks scroll position.
// All skipped when the visitor prefers reduced motion.
// 4) The announcement banner comes back on each new visit (runs always).
// 5) Listing thumbnails without alt text get alt="" (runs always).

// Blog/listing cards already name the post in their link text, so a
// thumbnail with no image-alt is decorative. Quarto omits alt entirely
// (it drops an empty image-alt), which makes screen readers read the
// file name; alt="" tells them to skip it. Posts that set image-alt keep it.
for (const img of document.querySelectorAll("img.thumbnail-image:not([alt])"))
  img.alt = "";

// Quarto remembers a dismissed announcement forever (localStorage).
// On the first page of a visit, forget it, so ✕ hides the banner while
// browsing the site but it's back next visit. "Visit" = sessionStorage:
// this tab, until it's closed. This inline script runs before Quarto
// checks for a dismissal (on DOMContentLoaded), so the banner never flashes.
(() => {
  try {
    if (sessionStorage.getItem("announce-visit")) return;
    sessionStorage.setItem("announce-visit", "1");
    for (const key of Object.keys(localStorage))
      if (key.startsWith("quarto-announce-")) localStorage.removeItem(key);
  } catch {}  // storage blocked: Quarto can't remember a dismissal either
})();

(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) { e.target.classList.add("revealed"); io.unobserve(e.target); }
    }
  }, { threshold: 0.1 });
  for (const el of document.querySelectorAll(".reveal")) {
    // only hide elements below the fold — no flash for above-fold content
    if (el.getBoundingClientRect().top > innerHeight) {
      el.classList.add("reveal-hidden");
      io.observe(el);
    }
  }

  // random resting tilts — a fresh arrangement every page load.
  // CSS reads --tilt via rotate(var(--tilt, 0deg)); tweak max degrees here.
  const tilt = (sel, max) => {
    for (const el of document.querySelectorAll(sel))
      el.style.setProperty("--tilt", ((Math.random() * 2 - 1) * max).toFixed(2) + "deg");
  };
  tilt(".signpost, .quarto-grid-item", 1.6);
  tilt(".photo-gallery img", 4);

  document.body.insertAdjacentHTML("afterbegin", '<div id="reading-progress"></div>');
  const bar = document.getElementById("reading-progress");
  const h = document.documentElement;
  addEventListener("scroll", () => {
    bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100 || 0) + "%";
  }, { passive: true });
})();
</script>
